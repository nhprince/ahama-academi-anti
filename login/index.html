<!doctype html>
<html lang="en" data-theme="system">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign In & Register — Ahama Academy</title>
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body style="min-height:100vh; display:flex; flex-direction:column; justify-content:space-between;">

  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="../">
        <span class="brand-mark">AA</span>
        <span>Ahama Academy</span>
      </a>

      <div class="header-actions">
        <button class="theme-btn" id="langToggleBtn" onclick="window.toggleLanguage()" title="Switch Language">🌐 EN</button>
        <button class="theme-btn" id="themeBtn">💻 System</button>
        <a class="btn btn-secondary btn-sm" href="../">← Back to Site</a>
      </div>
    </div>
  </header>

  <main class="container" style="max-width:460px; margin:40px auto;">
    <div class="panel" style="padding:32px;">
      
      <!-- Tab selector -->
      <div style="display:flex; border-bottom:1px solid var(--border); margin-bottom:24px;">
        <button id="tabLoginBtn" class="classroom-tab active" style="flex:1; text-align:center;" onclick="switchAuthTab('login')">Sign In</button>
        <button id="tabRegisterBtn" class="classroom-tab" style="flex:1; text-align:center;" onclick="switchAuthTab('register')">Create Account</button>
      </div>

      <!-- Google OAuth Sign-In Button -->
      <button type="button" class="btn btn-secondary btn-full" style="display:flex; align-items:center; justify-content:center; gap:10px; margin-bottom:16px; font-weight:600; padding:12px;" onclick="handleGoogleSignIn()">
        <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>
        <span>Continue with Google</span>
      </button>

      <div style="display:flex; align-items:center; gap:12px; margin-bottom:20px;">
        <div style="flex:1; height:1px; background:var(--border);"></div>
        <span style="font-size:11px; text-transform:uppercase; color:var(--muted); font-weight:600; letter-spacing:0.5px;">or with email</span>
        <div style="flex:1; height:1px; background:var(--border);"></div>
      </div>

      <!-- Quick 1-Click Demo Login Selector -->
      <div style="background:var(--soft); border-radius:var(--radius-md); padding:14px; margin-bottom:20px; font-size:12px;">
        <span style="font-weight:700; color:var(--text); display:block; margin-bottom:8px;">⚡ 1-Click Quick Demo Access:</span>
        <div style="display:flex; gap:8px;">
          <button class="btn btn-secondary btn-sm" style="flex:1; font-size:11px;" onclick="quickLogin('student')">👨‍🎓 Student Account</button>
          <button class="btn btn-secondary btn-sm" style="flex:1; font-size:11px;" onclick="quickLogin('admin')">👑 Admin Account</button>
        </div>
      </div>

      <!-- Login Form -->
      <form id="loginForm" onsubmit="handleLoginSubmit(event)">
        <div class="form-group">
          <label class="form-label">Email Address</label>
          <input type="email" id="loginEmail" class="form-input" placeholder="student@ahama.academy" required>
        </div>

        <div class="form-group">
          <label class="form-label">Password</label>
          <input type="password" id="loginPassword" class="form-input" placeholder="••••••••" required>
        </div>

        <button type="submit" id="loginSubmitBtn" class="btn btn-primary btn-full" style="margin-top:10px;">Sign In</button>
      </form>

      <!-- Register Form -->
      <form id="registerForm" style="display:none;" onsubmit="handleRegisterSubmit(event)">
        <div class="form-group">
          <label class="form-label">Full Name</label>
          <input type="text" id="regName" class="form-input" placeholder="Sahariyar Ahamad" required>
        </div>

        <div class="form-group">
          <label class="form-label">Email Address</label>
          <input type="email" id="regEmail" class="form-input" placeholder="student@example.com" required>
        </div>

        <div class="form-group">
          <label class="form-label">Password</label>
          <input type="password" id="regPassword" class="form-input" placeholder="Choose a strong password" required>
        </div>

        <button type="submit" id="regSubmitBtn" class="btn btn-primary btn-full" style="margin-top:10px;">Create Account</button>
      </form>

    </div>
  </main>

  <footer class="site-footer" style="margin-top:0;">
    <div class="container copyright">
      © 2026 Ahama Academy. All rights reserved.
    </div>
  </footer>

  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/i18n.js"></script>
  <script src="../assets/js/site.js"></script>
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const redirectUrl = urlParams.get('redirect') || '../student/';

    function switchAuthTab(mode) {
      const isLogin = mode === 'login';
      document.getElementById('tabLoginBtn').className = isLogin ? 'classroom-tab active' : 'classroom-tab';
      document.getElementById('tabRegisterBtn').className = isLogin ? 'classroom-tab' : 'classroom-tab active';
      document.getElementById('loginForm').style.display = isLogin ? 'block' : 'none';
      document.getElementById('registerForm').style.display = isLogin ? 'none' : 'block';
    }

    async function quickLogin(role) {
      if (role === 'admin') {
        document.getElementById('loginEmail').value = 'admin@ahama.academy';
        document.getElementById('loginPassword').value = 'admin123';
      } else {
        document.getElementById('loginEmail').value = 'student@ahama.academy';
        document.getElementById('loginPassword').value = 'student123';
      }
      document.getElementById('loginForm').dispatchEvent(new Event('submit'));
    }

    async function handleGoogleSignIn() {
      try {
        window.showToast('Connecting with Google Sign-In...', 'info');
        const res = await window.AhamaAPI.googleAuth('google-demo-token');
        window.showToast('Signed in as ' + (res.user.name || 'User') + '!', 'success');
        setTimeout(() => {
          window.location.href = redirectUrl;
        }, 800);
      } catch (err) {
        window.showToast(err.message || 'Google Sign-In failed', 'error');
      }
    }

    async function handleLoginSubmit(e) {
      e.preventDefault();
      const email = document.getElementById('loginEmail').value;
      const pass = document.getElementById('loginPassword').value;
      const btn = document.getElementById('loginSubmitBtn');

      try {
        btn.disabled = true;
        btn.textContent = 'Signing in...';
        const res = await window.AhamaAPI.login(email, pass);
        window.showToast('Welcome back, ' + (res.user.name || 'User') + '!', 'success');
        
        setTimeout(() => {
          if (res.user.role === 'admin' && !urlParams.get('redirect')) {
            window.location.href = '../admin/';
          } else {
            window.location.href = redirectUrl;
          }
        }, 800);
      } catch (err) {
        window.showToast(err.message || 'Login failed', 'error');
        btn.disabled = false;
        btn.textContent = 'Sign In';
      }
    }

    async function handleRegisterSubmit(e) {
      e.preventDefault();
      const name = document.getElementById('regName').value;
      const email = document.getElementById('regEmail').value;
      const pass = document.getElementById('regPassword').value;
      const btn = document.getElementById('regSubmitBtn');

      try {
        btn.disabled = true;
        btn.textContent = 'Creating account...';
        const res = await window.AhamaAPI.register(name, email, pass);
        window.showToast('Account created successfully!', 'success');
        setTimeout(() => {
          window.location.href = redirectUrl;
        }, 800);
      } catch (err) {
        window.showToast(err.message || 'Registration failed', 'error');
        btn.disabled = false;
        btn.textContent = 'Create Account';
      }
    }
  </script>
</body>
</html>
